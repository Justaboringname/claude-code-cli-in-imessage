<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t">
<title id="t">imessage-claude-bot, an iMessage auto-reply bot. A message in a 1-on-1 chat says 'hey claude, what's 2+2?'; the bot reads it from chat.db every 2 seconds, claude -p drafts a reply, and osascript sends it back.</title>
<style>
.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.tx { fill: #ecece8; }
.mu { fill: #9b9a94; }
.clay { fill: #d97757; }
.sage { fill: #9bb07c; }
.eyebrow { font-size: 22px; letter-spacing: 4px; }
.title { font-weight: 700; letter-spacing: -1.5px; }
.tag { font-size: 28px; }
.node { font-size: 24px; font-weight: 600; }
.sub { font-size: 22px; }
.cap { font-size: 22px; }
.small { font-size: 20px; }
.num { font-variant-numeric: tabular-nums; }
.msg { font-size: 24px; }
.hl { font-weight: 700; }
</style>
<rect x="0.5" y="0.5" width="1279" height="419" rx="20" fill="#181818" stroke="#2f2f2f" stroke-width="1"/>
<text class="mono eyebrow mu" x="72" y="104">IMESSAGE AUTO-REPLY BOT</text>
<text class="sans title tx" x="68" y="190" style="font-size:56px">imessage-claude-bot</text>
<text class="sans tag mu" x="72" y="250">Text “claude” in a 1-on-1 chat.</text>
<text class="sans tag mu" x="72" y="290">Claude Code drafts the reply.</text>
<text class="sans tag mu" x="72" y="330">Your subscription, no API key.</text>
<rect x="668" y="62" width="352" height="60" rx="30" fill="#212121" stroke="#333332" stroke-width="1.5"/>
<text class="sans msg tx" x="694" y="100">hey <tspan class="hl clay">claude</tspan>, what’s 2+2?</text>
<g fill="none" stroke="#5a5955" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M944 122 V170"/>
</g>
<path d="M944 172 L937.0 162.2 L951.0 162.2 Z" fill="#5a5955"/>
<rect x="846.0" y="174" width="196" height="48" rx="12" fill="#212121" stroke="#333332" stroke-width="1.5"/>
<circle cx="868.0" cy="198.0" r="5" fill="#d97757"/>
<text class="sans node tx" x="882.0" y="206.0">claude -p</text>
<text class="mono cap mu" x="962" y="156">chat.db · every 2s</text>
<g fill="none" stroke="#5a5955" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M944 222 V274"/>
</g>
<path d="M944 276 L937.0 266.2 L951.0 266.2 Z" fill="#5a5955"/>
<text class="mono cap sage" x="962" y="256">osascript</text>
<rect x="880" y="278" width="332" height="80" rx="30" fill="#212121" stroke="#9bb07c" stroke-width="1.5"/>
<rect x="910" y="302" width="260" height="10" rx="5" fill="#9bb07c" fill-opacity="0.55"/>
<rect x="910" y="324" width="176" height="10" rx="5" fill="#9bb07c" fill-opacity="0.55"/>
</svg>
